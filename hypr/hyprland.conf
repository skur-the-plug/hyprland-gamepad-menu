# Gamepad menu autostart
exec-once = /home/skur/.local/bin/gamepad-menu-listener

# Keyboard and common controller Home aliases
bind = SUPER, G, exec, /home/skur/.local/bin/game-menu
bindl = , XF86HomePage, exec, /home/skur/.local/bin/game-menu
bindl = , code:172, exec, /home/skur/.local/bin/game-menu
bindl = , code:316, exec, /home/skur/.local/bin/game-menu

# Floating centered overlay
windowrule {
    name = float-game-menu

    match:title = ^Game Menu$

    float = yes
    center = yes
}
